name: Verify

# Types and unit tests, on every push and every pull request.
#
# WHY THIS EXISTS. Four apps carried `"exclude": ["src/dev"]` and ten packages
# carried `"include": ["src"]`, so the compiler never saw a single check or test
# file. `tsc` was green for months while test doubles drifted away from the code
# they stood in for — a `Directory` four members stale, a `Wire` missing the two
# members shell recovery added, a `usage` stub predating the flag that says
# whether a provider reported anything at all. None of it was visible until the
# excludes came off, and then it was 110 errors across fourteen workspaces.
#
# The configs are fixed. This is what keeps them fixed: the failure mode is not
# somebody re-adding an exclude, it is nobody running `pnpm typecheck` before a
# merge and a drifted double surfacing days later, three packages away, as a
# runtime error that reads like somebody else's problem.
on:
  push:
    branches: [main, lyra]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref. Unlike the deploy
# workflow there is nothing to half-finish here, so cancelling is free.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A real Postgres beside the job, for the one step that needs two
    # connections that meet ("Check against Postgres", below). The job runs on
    # the runner itself, so the service is reached at localhost on the port
    # mapped here; the health check holds the steps back until it answers.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Changesets compares the branch against main — it needs the history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds in dependency order. An optional peer that a subpath
      # imports (prism/agent → cortex) is also a devDependency, which is what
      # puts the edge in turbo's graph — so the build runs parallel and safe.
      #
      # Both tasks below need this: apps resolve `@niscorp/*` to `dist`, not to
      # source, so an unbuilt package makes typecheck fail on stale types.
      - name: Build packages
        run: pnpm build

      # Inside the workspace every import resolves, declared or not. This packs
      # each package, lints the manifest (publint), checks every export's types
      # under node16 ESM and CJS (attw), and installs the tarballs into an
      # isolated scratch project to import and require every subpath — what a
      # consumer outside this repo actually gets. See scripts/check-packages.mts.
      - name: Check packages
        run: pnpm check:packages

      # `npm create nisc`, end to end: each kind of app made by the built
      # create-nisc, in a folder outside the workspace, installed from the packed
      # tarballs under pnpm's strict resolution, then typechecked, checked and
      # built. The templates pass inside the workspace by being linked to the
      # packages next door; this is what a new app actually gets. See
      # scripts/check-create.mts.
      - name: Check created apps
        run: pnpm check:create

      # The grammar gate (strata). A change to nova's or Prism's schemas without
      # a migration fails here, with the diff and what to append; and every real
      # document captured from the lab apps (strata/corpus) must still upgrade to
      # the current grammars and parse with the current strict schemas.
      - name: Check grammars
        run: pnpm check:grammars

      # Every lab app's source artifacts are written at the grammars it runs on
      # (strata.lock.json). A grammar that moved fails here until the app has run
      # `pnpm strata upgrade`, made the listed edits, and `strata verify` passed.
      - name: Check app sources
        run: pnpm check:sources

      # Tide writes facts through one door (engine/facts.ts), which is also
      # where they are announced. A second writer is how an emitted chain once
      # went missing from the event stream. See scripts/check-fact-door.mts.
      - name: Check the tide fact door
        run: pnpm check:fact-door

      # A package above the engines runs no SQL of its own: its reads and writes
      # are vex, as an application's are. Every statement that exists today is
      # counted per file in the script's ledger; a new one, or a number that no
      # longer matches, fails. A statement is counted whatever sends it and
      # however it is cased. The script tests itself first, and its header says
      # what it cannot see. See scripts/check-raw-sql.mts.
      - name: Check for SQL outside vex
        run: pnpm check:raw-sql

      # A package is made of modules: nothing new at the top of src/, a module is
      # imported by its door, and it imports only the modules it declares. Every
      # way a file names another counts, a type-only one included, and the three
      # roads round a door fail: the package's own name, an alias, a file of an
      # extension the check does not read. The script tests itself first. See
      # scripts/check-modules.mts.
      - name: Check the modules
        run: pnpm check:modules

      # What a package exports is a file in the repository (api.txt): each name,
      # and each member of an exported type, so a new one is a line in a diff
      # rather than an accident. It asks the compiler, and a type from another
      # package is read from its dist: it runs after the build. The script tests
      # itself first. See scripts/check-api.mts.
      - name: Check the public API
        run: pnpm check:api

      # What only a real Postgres can show. Every test of tide's store and of
      # moss runs on PGlite, which has one connection, so a fix for something
      # two processes do to each other passes there with the fix taken out.
      # This runs the three such races on the service above, each side on a
      # pool of its own: a serial group claimed by two instances of tide, the
      # generation pointer moved by two processes, two first registrations of
      # one integration; and the tables' migration, on an empty database and
      # again. Without the variable the script says it did not run and exits 0
      # (that is how `pnpm verify` stays usable on a machine with no Postgres);
      # here it is set, so here it runs. See scripts/check-postgres.mts.
      - name: Check against Postgres
        env:
          CHECK_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm check:postgres

      # The lint existed and nothing ran it. It holds the syntax the style guide
      # bans and, for moss's source and tide's store and driver, the stricter
      # rules: with the compiler's types (so it runs after the build), no `any`
      # that becomes a typed value, and a size for a function, a file and a line.
      # It first tries each of those rules on a case that must fail and a twin
      # that must pass (scripts/check-lint.mts), and it allows no warning.
      - name: Lint
        run: pnpm lint

      # Every package change on a PR carries a changeset — and no release breaks
      # an app: the packages are live on npm. A breaking bump (a major, or a
      # minor below 1.0) is refused unless its changeset carries the maintainer's
      # approval (`BREAKING — approved by …`), and an approved one is refused
      # until everything that depends or peers on it is released as breaking too
      # — Changesets alone would ship those dependents as patches with a moved
      # peer range. See scripts/check-changesets.mts. Push-to-main skips
      # this: there is no base to compare against. So does the release workflow's
      # Version Packages PR (branch changeset-release/*): it is what CONSUMES the
      # changesets, so it changes packages and carries none, by design.
      - name: Changesets
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }}
          pnpm check:changesets

      # Every workspace: ten packages and eight apps, tests and checks included.
      # This is the step that would have caught all 110.
      - name: Typecheck
        run: pnpm typecheck

      # The packages' own suites — 1,907 assertions. The apps' `check` scripts
      # are deliberately NOT here: they boot a database and a server each, they
      # take minutes, and three of them have known failures that predate this
      # workflow (atrium's connector proxy, relay's architect harness). Adding
      # them red would teach everybody to ignore a red tick, which is worse than
      # not running them.
      - name: Test
        run: pnpm test
