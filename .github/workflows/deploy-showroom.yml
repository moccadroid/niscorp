name: Deploy showroom to GitHub Pages

# Deploys only what Verify passed: it runs after a Verify run on a push to main
# finishes, and only if that run succeeded. A red main is never published, and
# a Verify run cancelled by a newer push deploys nothing — the newer one will.
# A manual dispatch deploys the branch it is run on, on the operator's word.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress run when a new push lands. Don't cancel an
# in-progress deploy though — let it finish, queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # The commit Verify checked — not whatever main is by the time this runs.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the showroom plus every workspace package it transitively
      # needs, in topological order. An optional peer that a subpath
      # imports (prism/agent → cortex) is also a devDependency, which is
      # what puts it in the build graph — no serial flag required.
      - name: Build showroom
        run: pnpm --filter showroom... run build

      # The QA Company, lyceum's stand-in third party: its bundle published as static
      # files beside the showroom (…/niscorp/vendor/bundle and
      # …/vendor-broken/bundle). lyceum installs it by that URL at the talk.
      - name: Publish the vendor demo's bundle
        run: pnpm --filter lyceum-vendor-demo run publish:to ../../showroom/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/showroom/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
