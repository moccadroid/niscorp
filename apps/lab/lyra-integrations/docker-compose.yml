# The integrations service's own database.
#
# NOT LYRA'S. Lyra runs on PGlite — schema and seed replayed onto an empty
# database every boot — and that is deliberate: its schema is still moving, and
# a disposable store is what makes editing it freely possible. This one is the
# opposite case. A connected payment account is created ONCE at a vendor and
# lives forever on their side; a pack that forgets which studio it belongs to
# has stranded a live merchant account nobody can reach. Everything else in this
# repo can be thrown away and regenerated. This cannot.
#
# ONE DATABASE, ONE TABLE PREFIX PER PACK (`stripe_`, `belts_`). Packs share a
# process already, so a second connection string per pack would be ceremony
# around a boundary the prefix states plainly — and `pack-check` asserts a pack
# only ever names its own.
services:
  db:
    image: postgres:17-alpine
    container_name: lyra-integrations-db
    environment:
      POSTGRES_USER: integrations
      POSTGRES_PASSWORD: integrations
      POSTGRES_DB: lyra_integrations
    ports:
      # 5433, NOT 5432. A local Postgres on the default port is common, and the
      # failure mode of a collision is not a refused connection — it is
      # connecting to the wrong database and being confused for twenty minutes.
      - '5433:5432'
    volumes:
      - lyra-integrations-data:/var/lib/postgresql/data
    healthcheck:
      # So `db:up` can wait for readiness rather than for a guessed number of
      # seconds. Postgres accepts TCP before it accepts queries.
      test: ['CMD-SHELL', 'pg_isready -U integrations -d lyra_integrations']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  lyra-integrations-data:
