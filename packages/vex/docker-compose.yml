services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: vex_dev
      POSTGRES_USER: vex
      POSTGRES_PASSWORD: vex
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vex -d vex_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
